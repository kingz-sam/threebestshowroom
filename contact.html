<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Three Best Showroom</title>

    <style>
        body {
            background-color: #f2f2f2;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif
        }

        header {
            background: #0166B1;
            color: #fff;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center
        }

        nav a {
            color: #fff;
            margin-left: 20px;
            text-decoration: none;
            font-weight: 700;
            gap: 10px
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 15px
        }

        h2 {
            letter-spacing: 2px
        }

        nav a {
            cursor: pointer;
            transition: 0.3s
        }

        nav a:hover {
            color: gold
        }

        .title {
            width: fit-content;
            margin: 80px auto 40px;
            background: #005ea6;
            color: #fff;
            padding: 25px 70px;
            border-radius: 15px
        }

        .title h2 {
            font-size: 60px
        }

        .contact-box {
            width: 50%;
            margin: 50px auto;
            background: #005ea6;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 5px 10px rgb(0 0 0 / .3)
        }

        .contact-box form {
            display: flex;
            flex-direction: column;
            gap: 25px
        }

        .contact-box input,
        .contact-box textarea {
            padding: 18px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            outline: none
        }

        .contact-box textarea {
            resize: none;
            height: 150px
        }

        .contact-box button {
            padding: 18px;
            border: none;
            border-radius: 10px;
            background: red;
            color: #fff;
            font-size: 22px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s
        }

        .contact-box button:hover {
            background: #c00
        }

        .info {
            text-align: center;
            margin-top: 30px;
            color: #fff;
            font-size: 20px;
            line-height: 40px
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">
            <img src="img/logo.png" alt="Gambar Logo" width="80px">
            <h2>Three Best Showroom</h2>
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="gallery.html">Shop Now</a>
            <a href="contact.html">Contact</a>
            <a href="bookingservis.html">Booking Service</a>
        </nav>
    </header>


    <div class="title">
        <h2>CONTACT US</h2>
    </div>



    <div class="contact-box">

        <form>

            <input type="text" placeholder="ENTER YOUR NAME">

            <input type="email" placeholder="ENTER YOUR EMAIL">

            <textarea placeholder="ENTER YOUR MESSAGE"></textarea>

            <button type="submit">SEND YOUR MESSAGGE</button>

        </form>

        <div class="information">
            <p>📍 Pontianak, Indonesia</p>
            <p>📞 0812-3456-7890</p>
            <p>📧 threebestshowroom@gmail.com</p>
        </div>

    </div>

</body>

</html>
